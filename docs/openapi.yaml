components:
  schemas:
    BatchDeleteImagesBody:
      properties:
        session_id:
          type: string
          title: Session Id
        image_ids:
          items:
            type: string
          type: array
          title: Image Ids
      type: object
      required:
      - session_id
      - image_ids
      title: BatchDeleteImagesBody
    BattleStatsResponse:
      properties:
        count:
          type: integer
          title: Count
        avg_duration_seconds:
          type: number
          title: Avg Duration Seconds
      type: object
      required:
      - count
      - avg_duration_seconds
      title: BattleStatsResponse
    Body_config_import_config_import_post:
      properties:
        name:
          type: string
          title: Name
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - name
      - file
      title: Body_config_import_config_import_post
    Body_config_task_import_config_task_import_post:
      properties:
        config_name:
          type: string
          title: Config Name
        task_name:
          type: string
          title: Task Name
        json_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Json Text
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
      type: object
      required:
      - config_name
      - task_name
      title: Body_config_task_import_config_task_import_post
    CropSaveBody:
      properties:
        session_id:
          type: string
          title: Session Id
        image_id:
          type: string
          title: Image Id
        task_name:
          type: string
          title: Task Name
        json_relpath:
          type: string
          title: Json Relpath
        image_name:
          type: string
          title: Image Name
        roi:
          type: string
          title: Roi
      type: object
      required:
      - session_id
      - image_id
      - task_name
      - json_relpath
      - image_name
      - roi
      title: CropSaveBody
    EmulatorStartBody:
      properties:
        session_id:
          type: string
          title: Session Id
        config_name:
          type: string
          title: Config Name
        frame_rate:
          type: integer
          title: Frame Rate
          default: 2
      type: object
      required:
      - session_id
      - config_name
      title: EmulatorStartBody
    ErrorDetailResponse:
      properties:
        id:
          type: string
          title: Id
          description: 错误目录名, 也是 error_id
        directory:
          type: string
          title: Directory
          description: 错误目录名
        script_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Script Name
          description: 错误所属脚本名; 旧目录没有脚本名时为 null
        timestamp_ms:
          type: integer
          title: Timestamp Ms
          description: 错误目录中的毫秒时间戳
        time:
          type: string
          title: Time
          description: 错误时间, 带本地时区的 ISO 字符串
        legacy:
          type: boolean
          title: Legacy
          description: 是否为旧格式纯时间戳目录
        log:
          $ref: '#/components/schemas/ErrorLogText'
          description: 错误目录下 log.txt 的内容
        images:
          items:
            $ref: '#/components/schemas/ErrorImageInfo'
          type: array
          title: Images
          description: 错误目录下的 PNG 截图元信息
      type: object
      required:
      - id
      - directory
      - timestamp_ms
      - time
      - legacy
      - log
      title: ErrorDetailResponse
      description: 错误日志详情响应。
    ErrorImageInfo:
      properties:
        name:
          type: string
          title: Name
          description: PNG 截图文件名
        size:
          type: integer
          title: Size
          description: 截图文件字节数
        modified_time:
          type: string
          title: Modified Time
          description: 截图文件修改时间
        url:
          type: string
          title: Url
          description: 读取该截图的接口 URL
      type: object
      required:
      - name
      - size
      - modified_time
      - url
      title: ErrorImageInfo
      description: 错误目录中单张截图的元信息。
    ErrorLogItem:
      properties:
        id:
          type: string
          title: Id
          description: 错误目录名, 也是详情接口的 error_id
        directory:
          type: string
          title: Directory
          description: 错误目录名
        script_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Script Name
          description: 错误所属脚本名; 旧目录没有脚本名时为 null
        timestamp_ms:
          type: integer
          title: Timestamp Ms
          description: 错误目录中的毫秒时间戳
        time:
