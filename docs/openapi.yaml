      - logs
      summary: Get Log Window
      description: 读取脚本日志的最新窗口或更旧窗口。
      operationId: get_log_window_logs__script_name__get
      parameters:
      - name: script_name
        in: path
        required: true
        schema:
          type: string
          description: 脚本配置名或日志脚本名
          title: Script Name
        description: 脚本配置名或日志脚本名
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 上一页返回的 older_cursor; 不传表示打开最新窗口
          title: Cursor
        description: 上一页返回的 older_cursor; 不传表示打开最新窗口
      - name: limit_lines
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          description: 本次最多返回的日志行数
          default: 500
          title: Limit Lines
        description: 本次最多返回的日志行数
      - name: limit_bytes
        in: query
        required: false
        schema:
          type: integer
          maximum: 1048576
          minimum: 4096
          description: 本次最多返回的日志字节数
          default: 262144
          title: Limit Bytes
        description: 本次最多返回的日志字节数
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogWindowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
