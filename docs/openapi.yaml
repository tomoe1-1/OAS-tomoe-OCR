  /logs/errors:
    get:
      tags:
      - logs
      summary: Get Error Logs
      description: '查询错误日志列表。


        不传 `date` 时, 返回对应脚本名的全部错误日志列表。'
      operationId: get_error_logs_logs_errors_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 目标日期, 格式为 YYYY-MM-DD, 不传则不过滤日期
          title: Date
        description: 目标日期, 格式为 YYYY-MM-DD, 不传则不过滤日期
      - name: script_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 可选脚本名过滤条件
          title: Script Name
        description: 可选脚本名过滤条件
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: 单页最多返回的错误目录数量
          default: 100
          title: Limit
        description: 单页最多返回的错误目录数量
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 上一页返回的分页 cursor
          title: Cursor
        description: 上一页返回的分页 cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLogListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
