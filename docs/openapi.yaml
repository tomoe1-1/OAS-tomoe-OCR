      operationId: get_error_log_detail_logs_errors__error_id__get
      parameters:
      - name: error_id
        in: path
        required: true
        schema:
          type: string
          description: 错误目录名, 支持 <script_name>_<timestamp_ms> 和旧格式 <timestamp_ms>
          title: Error Id
        description: 错误目录名, 支持 <script_name>_<timestamp_ms> 和旧格式 <timestamp_ms>
      - name: log_limit_bytes
        in: query
        required: false
        schema:
          type: integer
          maximum: 1048576
          minimum: 1
          description: log.txt 最多返回的字节数
          default: 262144
          title: Log Limit Bytes
        description: log.txt 最多返回的字节数
      responses:
